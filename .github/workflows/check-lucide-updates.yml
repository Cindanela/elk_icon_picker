name: Check Lucide icon updates

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Generate icons from upstream Lucide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run tool/generate_lucide_icons.dart --out="$RUNNER_TEMP/lucide_icons.g.dart"
          # Must match the formatting of the committed file, or every run
          # false-positives on line-wrapping differences alone. A file outside
          # the package is formatted with the SDK's latest language version,
          # which wraps long declarations differently, so pin it to the
          # package's own (from the `sdk: ^X.Y.Z` constraint in pubspec.yaml).
          LANGUAGE_VERSION=$(grep -oP '^\s*sdk:\s*\^\K[0-9]+\.[0-9]+' pubspec.yaml)
          dart format --language-version="$LANGUAGE_VERSION" "$RUNNER_TEMP/lucide_icons.g.dart"

      - name: Compare against committed icon data
        id: compare
        run: |
          if diff -q lib/src/gen/lucide_icons.g.dart "$RUNNER_TEMP/lucide_icons.g.dart" > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes upstream."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Icon names from each icon's `name: '...'` field (the declaration
          # line itself can wrap), and renamed-icon aliases from the
          # kLucideIconAliases map entries.
          grep -oP "^\s*name: '\K[^']+" lib/src/gen/lucide_icons.g.dart | sort > "$RUNNER_TEMP/old_names.txt"
          grep -oP "^\s*name: '\K[^']+" "$RUNNER_TEMP/lucide_icons.g.dart" | sort > "$RUNNER_TEMP/new_names.txt"
          grep -oP "^\s*'\K[a-z0-9-]+(?=': ')" "$RUNNER_TEMP/lucide_icons.g.dart" | sort -u > "$RUNNER_TEMP/new_aliases.txt"
          comm -23 "$RUNNER_TEMP/old_names.txt" "$RUNNER_TEMP/new_names.txt" > "$RUNNER_TEMP/gone.txt"

          OLD_COUNT=$(wc -l < "$RUNNER_TEMP/old_names.txt")
          NEW_COUNT=$(wc -l < "$RUNNER_TEMP/new_names.txt")
          echo "old_count=$OLD_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "Lucide's upstream icon source has changed since \`lib/src/gen/lucide_icons.g.dart\` was last generated."
            echo ""
            echo "**Icon count:** $OLD_COUNT → $NEW_COUNT"
            echo ""
            echo "### Added icons"
            ADDED=$(comm -13 "$RUNNER_TEMP/old_names.txt" "$RUNNER_TEMP/new_names.txt")
            if [ -z "$ADDED" ]; then echo "_none_"; else echo "$ADDED" | sed 's/^/- /'; fi
            echo ""
            echo "### Renamed icons"
            echo "Still work after regenerating: the old name becomes a deprecated constant and resolves via \`IconSearchService.findByName\`."
            echo ""
            RENAMED=$(comm -12 "$RUNNER_TEMP/gone.txt" "$RUNNER_TEMP/new_aliases.txt")
            if [ -z "$RENAMED" ]; then echo "_none_"; else echo "$RENAMED" | sed 's/^/- /'; fi
            echo ""
            echo "### Removed icons"
            echo "Removed icon names are a breaking change for any code referencing them directly — check downstream consumers before regenerating."
            echo ""
            REMOVED=$(comm -23 "$RUNNER_TEMP/gone.txt" "$RUNNER_TEMP/new_aliases.txt")
            if [ -z "$REMOVED" ]; then echo "_none_"; else echo "$REMOVED" | sed 's/^/- /'; fi
            echo ""
            echo "### Other changes"
            echo "Icons present in both sets may also have updated path/shape data (upstream redesigns) not reflected above — the file diff is the source of truth."
            echo ""
            echo "---"
            echo "To regenerate: \`dart run tool/generate_lucide_icons.dart\`, then \`dart format\`, \`flutter analyze\`, and a manual review before committing."
          } > "$RUNNER_TEMP/issue_body.md"

      - name: Ensure the lucide-icons label exists
        if: steps.compare.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create lucide-icons \
            --color FFA500 \
            --description "Upstream Lucide icon set has drifted from generated data" \
            2>/dev/null || true

      - name: Check for an existing open issue
        if: steps.compare.outputs.changed == 'true'
        id: existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --label lucide-icons --state open --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open issue
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Lucide icon set changed upstream (${{ steps.compare.outputs.old_count }} → ${{ steps.compare.outputs.new_count }} icons)" \
            --body-file "$RUNNER_TEMP/issue_body.md" \
            --label lucide-icons
